<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHALLENGER — تحدّاك</title>
<style>
:root{--bg:#090d18;--panel:#141b2d;--panel2:#1b2540;--line:#293654;--txt:#f4f7ff;--muted:#9eabc7;--a:#7c5cff;--b:#21d4a5;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#29345c 0,transparent 38%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{padding:24px 18px 16px;max-width:900px;margin:auto} .brand{font-size:13px;color:#a99bff;font-weight:800;letter-spacing:3px}.hero{font-size:30px;font-weight:950;margin:5px 0}.sub{color:var(--muted);font-size:14px}
main{max-width:900px;margin:auto;padding:0 14px 36px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 22px}.stat,.card,.game{background:linear-gradient(145deg,var(--panel),#101729);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}
h2{font-size:19px;margin:20px 2px 12px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{min-height:118px;text-align:right;cursor:pointer;transition:.15s;color:var(--txt)}.game:active{transform:scale(.98)}.emoji{font-size:29px}.game strong{display:block;margin:6px 0 2px}.game small{color:var(--muted)}button{font:inherit;border:0;cursor:pointer}.primary{background:linear-gradient(110deg,var(--a),#a34fff);color:white;padding:12px 18px;border-radius:13px;font-weight:800}.secondary{background:var(--panel2);color:white;border:1px solid var(--line);padding:10px 15px;border-radius:12px}.screen{display:none}.screen.active{display:block}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 14px}.question{font-size:22px;font-weight:850;line-height:1.5;margin:18px 0}.answers{display:grid;gap:9px}.answer{background:var(--panel2);color:white;border:1px solid var(--line);padding:13px;border-radius:12px;text-align:right}.answer.good{border-color:var(--b);background:#123b38}.answer.bad{border-color:#ff667a;background:#3d1d2b}.muted{color:var(--muted)}.big{font-size:34px;font-weight:950;text-align:center;margin:22px 0}.center{text-align:center}.arena{background:#0b392f;border:8px solid #70452b;border-radius:18px;padding:14px;max-width:560px;margin:10px auto;box-shadow:inset 0 0 0 3px #a87a4b}.pool{width:100%;height:auto;display:block;touch-action:manipulation}.hint{color:var(--muted);font-size:13px;line-height:1.7}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.meter{height:9px;background:#27334c;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));width:0%}
#court{display:block;width:100%;max-width:560px;margin:10px auto;background:#c8793d;border:5px solid #f0c28a;border-radius:15px;touch-action:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202b45;padding:10px 16px;border-radius:12px;display:none;z-index:9}
@media(min-width:650px){.games{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><div class="brand">CHALLENGER</div><div class="hero">تحدّاك! 🔥</div><div class="sub">العب، اجمع النقاط، وتفوّق على أصحابك</div></header>
<main>
<section id="home" class="screen active">
<div class="stats"><div class="stat"><b id="points">0</b><small>نقاطك</small></div><div class="stat"><b id="level">1</b><small>مستواك</small></div><div class="stat"><b id="wins">0</b><small>انتصاراتك</small></div></div>
<h2>اختر لعبتك</h2>
<div class="games">
<button class="game" onclick="startQuiz('general')"><span class="emoji">🧠</span><strong>أسئلة عامة</strong><small>اختبر معلوماتك</small></button>
<button class="game" onclick="startQuiz('cars')"><span class="emoji">🚘</span><strong>خبير السيارات</strong><small>تحدي السيارات</small></button>
<button class="game" onclick="startQuiz('riddles')"><span class="emoji">🧩</span><strong>ألغاز سريعة</strong><small>شغّل مخك</small></button>
<button class="game" onclick="startReaction()"><span class="emoji">⚡</span><strong>سرعة ردة الفعل</strong><small>كم سرعة استجابتك؟</small></button>
<button class="game" onclick="startMemory()"><span class="emoji">🧠</span><strong>اختبار الذاكرة</strong><small>احفظ التسلسل</small></button>
<button class="game" onclick="startMath()"><span class="emoji">➗</span><strong>سباق الحساب</strong><small>30 ثانية تحدي</small></button>
<button class="game" onclick="startXO()"><span class="emoji">❌</span><strong>إكس أو XO</strong><small>ضد الكمبيوتر أو صديقك</small></button>
<button class="game" onclick="startPool()"><span class="emoji">🎱</span><strong>البلياردو</strong><small>صوّب واسحب للتسديد</small></button>
<button class="game" onclick="startBasket()"><span class="emoji">🏀</span><strong>كرة السلة</strong><small>سدّد واجمع النقاط</small></button>
</div>
<h2>لوحة الصدارة</h2><div class="card"><div>🥇 Player One <b style="float:left">2400</b></div><hr style="border-color:var(--line)"><div>🥈 Champion <b style="float:left">1850</b></div><hr style="border-color:var(--line)"><div>🥉 أنت <b id="rankPoints" style="float:left">0</b></div><p class="hint">الترتيب هنا تجريبي ومحفوظ على هذا الجهاز فقط.</p></div>
</section>
<section id="play" class="screen">
<div class="topline"><button class="secondary" onclick="goHome()">← رجوع</button><b id="gameTitle">اللعبة</b><span id="scoreLabel" class="muted"></span></div>
<div id="gameArea"></div>
</section>
</main><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let points=+(localStorage.challengerPoints||0),wins=+(localStorage.challengerWins||0);
function refresh(){ $('points').textContent=points;$('level').textContent=Math.floor(points/100)+1;$('wins').textContent=wins;$('rankPoints').textContent=points;localStorage.challengerPoints=points;localStorage.challengerWins=wins}
function award(n,win=false){points+=n;if(win)wins++;refresh();toast('+'+n+' نقطة!')}
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function show(title,html){$('home').classList.remove('active');$('play').classList.add('active');$('gameTitle').textContent=title;$('gameArea').innerHTML=html;$('scoreLabel').textContent=''}
function goHome(){ $('play').classList.remove('active');$('home').classList.add('active');refresh();if(poolRAF)cancelAnimationFrame(poolRAF);if(basketRAF)cancelAnimationFrame(basketRAF);clearInterval(timer)}
const banks={
general:[['ما عاصمة اليابان؟',['طوكيو','سيول','بكين'],0],['كم عدد ألوان قوس قزح؟',['5','7','9'],1],['ما أكبر كوكب؟',['الأرض','المشتري','المريخ'],1],['ما أسرع حيوان بري؟',['الفهد','الحصان','الأسد'],0],['كم ضلعًا للمثلث؟',['3','4','5'],0],['ما لغة البرازيل الرسمية؟',['الإسبانية','البرتغالية','الفرنسية'],1]],
cars:[['أي شركة تصنع كامري؟',['نيسان','تويوتا','هوندا'],1],['ما نوع سيارة باترول؟',['SUV','سيدان','هاتشباك'],0],['أين يقع مقر فيراري؟',['إيطاليا','ألمانيا','اليابان'],0],['ما وقود السيارات الكهربائية؟',['البنزين','الكهرباء','الديزل'],1],['أي شركة تصنع موستانج؟',['فورد','BMW','كيا'],0]],
riddles:[['شيء له أسنان ولا يعض؟',['المشط','الكلب','المفتاح'],0],['كلما أخذت منه كبر؟',['الحفرة','العمر','البحر'],0],['يمشي بلا أرجل؟',['الوقت','الكرسي','القلم'],0],['له عين ولا يرى؟',['الإبرة','القط','الكاميرا'],0],['ما الشيء الذي يكتب ولا يقرأ؟',['القلم','الكتاب','الطالب'],0]]
};
let timer=null;
function startQuiz(type){let qs=[...banks[type]].sort(()=>Math.random()-.5).slice(0,5),i=0,sc=0;show(type==='cars'?'خبير السيارات':type==='riddles'?'ألغاز سريعة':'أسئلة عامة','<div class="muted" id="qcount"></div><div class="question" id="q"></div><div class="answers" id="opts"></div><div class="hint center" id="feedback"></div>');function draw(){if(i>=qs.length){award(sc*10,sc>=4);$('gameArea').innerHTML=`<div class="center"><div class="big">🏁 انتهى التحدي</div><h2>نتيجتك ${sc} من ${qs.length}</h2><button class="primary" onclick="startQuiz('${type}')">العب مرة ثانية</button></div>`;return}let q=qs[i];$('qcount').textContent=`السؤال ${i+1} من ${qs.length}`;$('q').textContent=q[0];$('opts').innerHTML=q[1].map((a,j)=>`<button class="answer" onclick="pick(${j})">${a}</button>`).join('')}window.pick=j=>{let q=qs[i];if(j===q[2]){sc++;$('feedback').textContent='إجابة صحيحة!';}else $('feedback').textContent='الإجابة الصحيحة: '+q[1][q[2]];[...$('opts').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===j)b.classList.add('bad')});i++;setTimeout(draw,650)};draw()}
function startReaction(){show('سرعة ردة الفعل','<div class="center"><p class="hint">اضغط ابدأ، وانتظر حتى يتحول المربع للأخضر ثم اضغط بسرعة.</p><button class="primary" id="begin">ابدأ</button><div id="react" style="margin:22px 0;background:#26334d;padding:55px 10px;border-radius:18px;font-size:22px">استعد...</div><div class="big" id="reactResult">—</div></div>');let ready=false,start=0,timeout;$('begin').onclick=()=>{clearTimeout(timeout);ready=false;$('react').style.background='#9a5935';$('react').textContent='انتظر...';timeout=setTimeout(()=>{ready=true;start=performance.now();$('react').style.background='#087c58';$('react').textContent='اضغط الآن!'},1200+Math.random()*2800)};$('react').onclick=()=>{if(!ready){$('reactResult').textContent='بدري! حاول مرة ثانية';clearTimeout(timeout);return}let ms=Math.round(performance.now()-start);$('reactResult').textContent=ms+' ms';award(Math.max(5,Math.round(100-ms/8)));ready=false}}
function startMemory(){let seq=[],input=[],level=1;show('اختبار الذاكرة','<div class="center"><p class="hint">شاهد الرموز بالترتيب ثم كررها.</p><div class="big" id="memDisplay">جاهز؟</div><div class="controls" id="memBtns"></div><button class="primary" id="memStart">ابدأ</button><div id="memMsg" class="hint"></div>');const symbols=['🔴','🔵','🟢','🟡'];$('memStart').onclick=()=>next();function next(){seq.push(symbols[Math.floor(Math.random()*4)]);input=[];$('memBtns').innerHTML=symbols.map(s=>`<button class="secondary" style="font-size:25px" onclick="memTap('${s}')">${s}</button>`).join('');let k=0;$('memDisplay').textContent='شاهد';let iv=setInterval(()=>{if(k<seq.length){$('memDisplay').textContent=seq[k++]}else{clearInterval(iv);$('memDisplay').textContent='دورك!'}},650)}window.memTap=s=>{input.push(s);if(input[input.length-1]!==seq[input.length-1]){$('memMsg').textContent='انتهت! وصلت للمستوى '+(level-1);award((level-1)*15,level>4);$('memDisplay').textContent='💥';return}if(input.length===seq.length){level++;$('memMsg').textContent='ممتاز! المستوى '+level;setTimeout(next,600)}}}
function startMath(){let score=0,left=30,a,b,iv;show('سباق الحساب','<div class="center"><div class="big" id="mathTime">30</div><div class="question" id="mathQ"></div><input id="mathA" type="number" inputmode="numeric" placeholder="اكتب الإجابة" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#101729;color:white;font-size:20px;text-align:center"><div class="controls"><button class="primary" id="mathGo">إجابة</button></div><div id="mathScore" class="muted">النقاط: 0</div></div>');function q(){a=2+Math.floor(Math.random()*12);b=2+Math.floor(Math.random()*12);$('mathQ').textContent=`${a} × ${b} = ؟`;$('mathA').value=''}q();$('mathGo').onclick=()=>{if(+$('mathA').value===a*b){score+=5;$('mathScore').textContent='النقاط: '+score;q()}else toast('حاول مرة ثانية')};iv=setInterval(()=>{left--;$('mathTime').textContent=left;if(left<=0){clearInterval(iv);award(score,score>=30);$('gameArea').innerHTML=`<div class="center"><div class="big">انتهى الوقت!</div><h2>جمعت ${score} نقطة</h2><button class="primary" onclick="startMath()">إعادة</button></div>`}},1000)}
let xoBoard, xoTurn, xoMode, xoOver;
function startXO(){xoBoard=Array(9).fill('');xoTurn='X';xoOver=false;xoMode='ai';show('إكس أو XO',`<div class="center"><div class="controls"><button class="secondary" onclick="setXOMode('ai')">ضد الكمبيوتر</button><button class="secondary" onclick="setXOMode('two')">لاعبان</button></div><div id="xoStatus" class="question">دور ❌</div><div id="xoGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:15px auto"></div><button class="primary" onclick="startXO()">جولة جديدة</button></div>`);renderXO()}
function setXOMode(m){xoMode=m;startXO()}
function renderXO(){ $('xoGrid').innerHTML=xoBoard.map((v,i)=>`<button class="secondary" style="height:95px;font-size:42px;font-weight:900" onclick="xoMove(${i})">${v==='X'?'❌':v==='O'?'⭕':''}</button>`).join('');$('xoStatus').textContent=xoOver?'انتهت الجولة':`دور ${xoTurn==='X'?'❌':'⭕'}`}
function winner(b){for(let [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'draw':null}
function xoMove(i){if(xoOver||xoBoard[i])return;xoBoard[i]=xoTurn;let w=winner(xoBoard);if(w){endXO(w);return}xoTurn=xoTurn==='X'?'O':'X';renderXO();if(xoMode==='ai'&&xoTurn==='O')setTimeout(aiXO,350)}
function aiXO(){if(xoOver)return;let empty=xoBoard.map((v,i)=>v?null:i).filter(v=>v!==null),choice;for(let mark of ['O','X']){for(let i of empty){let b=[...xoBoard];b[i]=mark;if(winner(b)===mark){choice=i;break}}if(choice!==undefined)break}if(choice===undefined)choice=xoBoard[4]===''?4:empty[Math.floor(Math.random()*empty.length)];xoBoard[choice]='O';let w=winner(xoBoard);if(w)endXO(w);else{xoTurn='X';renderXO()}}
function endXO(w){xoOver=true;renderXO();if(w==='draw')$('xoStatus').textContent='تعادل!';else{$('xoStatus').textContent=(w==='X'?'❌':'⭕')+' فاز!';if(w==='X')award(25,true);else if(xoMode==='two')award(25,true)}}
let poolCanvas,poolCtx,poolBalls=[],poolRAF=0,poolShots=0,poolAim={x:0,y:0},poolDown=false;
function startPool(){show('البلياردو 🎱','<div class="center"><p class="hint">اسحب من الكرة البيضاء للخلف ثم اترك للتسديد. الهدف إدخال أكبر عدد من الكرات.</p><div class="arena"><canvas id="poolCanvas" class="pool" width="600" height="330"></canvas></div><div class="muted" id="poolScore">الكرات المدخلة: 0 · التسديدات: 0</div><div class="controls"><button class="secondary" onclick="resetPool()">إعادة الطاولة</button></div><p class="hint">نسخة تدريبية مبسطة بفيزياء تصادم ثنائية الأبعاد.</p></div>');poolCanvas=$('poolCanvas');poolCtx=poolCanvas.getContext('2d');resetPool();poolCanvas.onpointerdown=e=>{let p=poolPos(e);poolDown=true;poolAim=p};poolCanvas.onpointerup=e=>{if(!poolDown)return;let p=poolPos(e),cue=poolBalls[0],dx=cue.x-p.x,dy=cue.y-p.y,mag=Math.hypot(dx,dy);if(mag>3){let power=Math.min(18,mag*.12);cue.vx=dx/mag*power;cue.vy=dy/mag*power;poolShots++}poolDown=false};}
function poolPos(e){let r=poolCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*330/r.height}}
function resetPool(){poolBalls=[{x:145,y:165,vx:0,vy:0,c:'#f5f5f5',cue:true}];let colors=['#f2c230','#2878dc','#d83c42','#7c4ac7','#ef8c26','#239e68','#a52b31'];for(let row=0,k=0;row<4;row++)for(let col=0;col<=row;col++)poolBalls.push({x:390+row*23,y:165+(col-row/2)*25,vx:0,vy:0,c:colors[k++%colors.length]});poolShots=0;poolLoop()}
function poolLoop(){if(!poolCanvas)return;let c=poolCtx;c.clearRect(0,0,600,330);c.fillStyle='#08724f';c.fillRect(0,0,600,330);c.fillStyle='#052f24';[[0,0],[300,0],[600,0],[0,330],[300,330],[600,330]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,17,0,Math.PI*2);c.fill()});let sunk=0;for(let i=0;i<poolBalls.length;i++){let b=poolBalls[i];if(b.sunk)continue;b.x+=b.vx;b.y+=b.vy;b.vx*=.988;b.vy*=.988;if(Math.abs(b.vx)+Math.abs(b.vy)<.025)b.vx=b.vy=0;if(b.x<17||b.x>583){if(b.x<17&& (b.y<27||b.y>303))b.sunk=true;else{b.vx*=-.88;b.x=Math.max(17,Math.min(583,b.x))}}if(b.y<17||b.y>313){if(b.x<27||b.x>573||Math.abs(b.x-300)<18)b.sunk=true;else{b.vy*=-.88;b.y=Math.max(17,Math.min(313,b.y))}}for(let j=i+1;j<poolBalls.length;j++){let o=poolBalls[j];if(o.sunk)continue;let dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||.01;if(d<20){let nx=dx/d,ny=dy/d,dv=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny;if(dv>0){b.vx-=dv*nx;b.vy-=dv*ny;o.vx+=dv*nx;o.vy+=dv*ny}let overlap=(20-d)/2;b.x-=nx*overlap;b.y-=ny*overlap;o.x+=nx*overlap;o.y+=ny*overlap}}if(b.sunk){if(b.cue){b.sunk=false;b.x=145;b.y=165;b.vx=b.vy=0}else sunk++}else{c.beginPath();c.arc(b.x,b.y,10,0,Math.PI*2);c.fillStyle=b.c;c.fill();c.strokeStyle='#ffffff88';c.lineWidth=2;c.stroke();c.beginPath();c.arc(b.x-3,b.y-3,2,0,Math.PI*2);c.fillStyle='white';c.fill()}}$('poolScore').textContent=`الكرات المدخلة: ${sunk} · التسديدات: ${poolShots}`;if(poolDown){let cue=poolBalls[0];c.beginPath();c.moveTo(cue.x,cue.y);c.lineTo(poolAim.x,poolAim.y);c.strokeStyle='#fff';c.setLineDash([7,6]);c.stroke();c.setLineDash([])}if(sunk>=5&&!poolAwarded){poolAwarded=true;award(sunk*10,true)}poolRAF=requestAnimationFrame(poolLoop)}
let poolAwarded=false;
function startBasket(){show('كرة السلة 🏀','<div class="center"><p class="hint">اسحب الكرة للخلف ثم ارفع إصبعك باتجاه السلة. حاول تسجيل أكبر عدد خلال 30 ثانية.</p><canvas id="court" width="560" height="430"></canvas><div class="muted" id="basketInfo">النقاط: 0 · الوقت: 30</div><button class="secondary" onclick="startBasket()">إعادة اللعب</button></div>');basketCanvas=$('court');basketCtx=basketCanvas.getContext('2d');basketScore=0;basketTime=30;basketBall={x:90,y:340,vx:0,vy:0};basketDrag=false;basketDone=false;basketTimer=setInterval(()=>{basketTime--;$('basketInfo').textContent=`النقاط: ${basketScore} · الوقت: ${basketTime}`;if(basketTime<=0){clearInterval(basketTimer);basketDone=true;award(basketScore*10,basketScore>=3);$('basketInfo').textContent=`انتهى الوقت! نتيجتك: ${basketScore}`}},1000);basketCanvas.onpointerdown=e=>{if(basketBall.vx===0&&basketBall.vy===0){basketDrag=true;basketStart=bp(e)}};basketCanvas.onpointerup=e=>{if(!basketDrag)return;let p=bp(e),dx=basketStart.x-p.x,dy=basketStart.y-p.y;basketBall.vx=Math.max(-15,Math.min(15,dx*.12));basketBall.vy=Math.max(-19,Math.min(8,dy*.12));basketDrag=false};basketLoop()}
let basketCanvas,basketCtx,basketBall,basketScore=0,basketTime=30,basketTimer,basketRAF=0,basketDrag=false,basketStart={x:0,y:0},basketDone=false;
function bp(e){let r=basketCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*430/r.height}}
