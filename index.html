<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090d1c">
<title>CHALLENGER — تحدّاك</title>
<style>
:root{--bg:#090d1c;--panel:#141b31;--panel2:#1b2542;--line:#2b385c;--text:#f4f6ff;--muted:#9eabc9;--cyan:#43e2ff;--pink:#ff4fa3;--gold:#ffd166;--green:#5df2ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#253d72 0,transparent 35%),radial-gradient(circle at 0 40%,#29173d 0,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit} .wrap{max-width:1050px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),#6378ff 55%,var(--pink));display:grid;place-items:center;color:#07101d;font-size:25px;font-weight:1000;box-shadow:0 8px 30px #43e2ff44}.brand h1{font-size:clamp(19px,4vw,27px);margin:0;letter-spacing:.5px}.brand small{color:var(--muted)}.profile{display:flex;gap:8px;align-items:center;background:#ffffff0c;border:1px solid var(--line);padding:9px 12px;border-radius:14px;font-size:13px}.hero{background:linear-gradient(120deg,#192b4cdd,#321d48dd);border:1px solid #53638a66;border-radius:24px;padding:22px;position:relative;overflow:hidden}.hero:after{content:"⚡";position:absolute;left:22px;top:-22px;font-size:120px;opacity:.08;transform:rotate(-15deg)}.hero h2{margin:0 0 7px;font-size:clamp(24px,5vw,38px)}.hero p{margin:0;color:#c4cce1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#080e20a8;border:1px solid #ffffff18;border-radius:15px;padding:12px}.stat b{display:block;font-size:21px;color:var(--cyan)}.stat span{font-size:12px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px}.section-title h3{margin:0;font-size:19px}.section-title span{color:var(--muted);font-size:12px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{background:linear-gradient(145deg,#18213a,#11182b);border:1px solid var(--line);border-radius:19px;padding:16px;text-align:right;min-height:130px;transition:.18s;position:relative;overflow:hidden}.game:active{transform:scale(.98)}.game .emoji{font-size:30px}.game h4{margin:8px 0 3px;font-size:17px}.game p{margin:0;color:var(--muted);font-size:12px}.game .go{position:absolute;left:14px;bottom:14px;color:var(--cyan);font-size:20px}
.primary{background:linear-gradient(100deg,#35d9ff,#7778ff);color:#07101d;font-weight:900;padding:12px 18px;border-radius:13px;box-shadow:0 7px 22px #43e2ff24}.secondary{background:#ffffff10;border:1px solid var(--line);padding:10px 14px;border-radius:12px}.danger{background:#ff4f7540;border:1px solid #ff4f7570;padding:10px 14px;border-radius:12px}.muted{color:var(--muted)}.screen{display:none;margin-top:18px;background:#11192c;border:1px solid var(--line);border-radius:22px;padding:18px}.screen.active{display:block}.screen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.screen-head h2{margin:0;font-size:21px}.question{font-size:22px;font-weight:800;line-height:1.6;margin:18px 0}.answers{display:grid;gap:9px}.answer{background:#202b48;border:1px solid #3a496e;border-radius:13px;padding:13px;text-align:right}.answer:active{background:#30436c}.answer.correct{border-color:var(--green);background:#174333}.answer.wrong{border-color:var(--pink);background:#4a203b}.game-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}.big-number{font-size:46px;font-weight:1000;color:var(--cyan);text-align:center;margin:16px}.center{text-align:center}.reaction-pad{height:190px;border-radius:20px;background:#8b2d4d;display:grid;place-items:center;font-size:22px;font-weight:900;margin:15px 0;user-select:none;touch-action:manipulation}.reaction-pad.ready{background:#166f4e}.reaction-pad.wait{background:#8b2d4d}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:18px auto}.memory-cell{aspect-ratio:1;background:#253354;border:1px solid #42557f;border-radius:13px;font-size:28px}.memory-cell.open{background:#344b7b}.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:18px auto}.xo button{aspect-ratio:1;border-radius:15px;background:#202c49;border:1px solid #3a4b72;font-size:42px;font-weight:900;color:var(--cyan)}.xo button.o{color:var(--pink)}.pool{background:radial-gradient(ellipse,#126d55,#064332);border:10px solid #70452c;border-radius:24px;padding:15px;margin:15px 0;min-height:190px;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.ball{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#f2d8a2 20%,#c38d4c 70%);box-shadow:2px 3px 5px #0019}.ball:nth-child(2n){background:radial-gradient(circle at 30% 25%,white,#f5f5f5 20%,#3979c9 70%)}.court{height:190px;border-radius:18px;background:linear-gradient(90deg,#a95b2d,#d68a4b);border:5px solid #f1c18a;display:grid;place-items:center;margin:14px 0;position:relative}.hoop{font-size:64px}.shot{font-size:34px;touch-action:none}.field{width:100%;background:#0b1222;border:1px solid var(--line);color:white;padding:12px;border-radius:12px;margin:7px 0}.notice{padding:12px;background:#172640;border:1px solid #34496f;border-radius:12px;color:#dce8ff;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#7381a3;font-size:11px;padding:25px 0}
@media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}.hero{padding:30px}.stats{max-width:520px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">C</div><div><h1>CHALLENGER</h1><small>تحدّاك — العبها مع أصحابك</small></div></div><div class="profile"><span>⭐</span><b id="level">المستوى 1</b></div></header>
<section class="hero"><h2>مين فيكم الأسطورة؟ 🔥</h2><p>تحديات سريعة، ألعاب ذكاء، ومنافسة على النقاط.</p><div class="stats"><div class="stat"><b id="points">0</b><span>نقاطك</span></div><div class="stat"><b id="wins">0</b><span>انتصاراتك</span></div><div class="stat"><b id="rank">مبتدئ</b><span>لقبك</span></div></div></section>
<div class="section-title"><h3>اختر لعبتك</h3><span>9 ألعاب متاحة</span></div>
<div class="games">
<button class="game" onclick="openGame('quiz')"><div class="emoji">🧠</div><h4>أسئلة عامة</h4><p>اختبر معلوماتك وتحدى نفسك</p><span class="go">←</span></button>
<button class="game" onclick="openGame('cars')"><div class="emoji">🏎️</div><h4>خبير السيارات</h4><p>تعرف على السيارات ومواصفاتها</p><span class="go">←</span></button>
<button class="game" onclick="openGame('riddle')"><div class="emoji">🧩</div><h4>ألغاز سريعة</h4><p>فكر بسرعة واكتشف الحل</p><span class="go">←</span></button>
<button class="game" onclick="openGame('reaction')"><div class="emoji">⚡</div><h4>سرعة ردة الفعل</h4><p>اضغط بأسرع وقت ممكن</p><span class="go">←</span></button>
<button class="game" onclick="openGame('memory')"><div class="emoji">🎴</div><h4>اختبار الذاكرة</h4><p>طابق الرموز المتشابهة</p><span class="go">←</span></button>
<button class="game" onclick="openGame('math')"><div class="emoji">➗</div><h4>سباق الحساب</h4><p>حل أكبر عدد من المسائل</p><span class="go">←</span></button>
<button class="game" onclick="openGame('xo')"><div class="emoji">⭕</div><h4>XO</h4><p>ضد الكمبيوتر أو لاعب ثاني</p><span class="go">←</span></button>
<button class="game" onclick="openGame('pool')"><div class="emoji">🎱</div><h4>بلياردو مصغر</h4><p>اسحب للتسديد وسجّل النقاط</p><span class="go">←</span></button>
<button class="game" onclick="openGame('basket')"><div class="emoji">🏀</div><h4>تحدي السلة</h4><p>صوّب الكرة نحو السلة</p><span class="go">←</span></button>
</div>
<section id="screen" class="screen"><div class="screen-head"><h2 id="gameTitle">اللعبة</h2><button class="secondary" onclick="closeGame()">✕ رجوع</button></div><div id="gameArea"></div></section>
<footer>CHALLENGER © تحدّاك • نسخة تجريبية تعمل على جهازك</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let points=Number(localStorage.ch_points||0),wins=Number(localStorage.ch_wins||0),current='',timer=null;
function save(){localStorage.ch_points=points;localStorage.ch_wins=wins;$('points').textContent=points;$('wins').textContent=wins;$('level').textContent='المستوى '+(Math.floor(points/100)+1);$('rank').textContent=points>=500?'أسطورة':points>=200?'محترف':points>=50?'متقدم':'مبتدئ'}
function award(n=10){points+=n;wins++;save()}
function openGame(g){clearInterval(timer);current=g;$('screen').classList.add('active');$('screen').scrollIntoView({behavior:'smooth',block:'start'});const names={quiz:'أسئلة عامة',cars:'خبير السيارات',riddle:'ألغاز سريعة',reaction:'سرعة ردة الفعل',memory:'اختبار الذاكرة',math:'سباق الحساب',xo:'XO',pool:'بلياردو مصغر',basket:'تحدي السلة'};$('gameTitle').textContent=names[g];({quiz:quiz,cars:cars,riddle:riddle,reaction:reaction,memory:memory,math:math,xo:xo,pool:pool,basket:basket}[g])()}
function closeGame(){clearInterval(timer);$('screen').classList.remove('active');current=''}
const banks={
quiz:[['ما عاصمة اليابان؟',['طوكيو','أوساكا','كيوتو'],0],['كم عدد أضلاع المثلث؟',['2','3','4'],1],['ما أكبر كوكب؟',['الأرض','المشتري','المريخ'],1],['كم دقيقة في الساعة؟',['30','60','100'],1],['ما لون الزمرد غالبًا؟',['أخضر','أزرق','أحمر'],0]],
cars:[['أي شركة تصنع كامري؟',['تويوتا','نيسان','هوندا'],0],['باترول من شركة؟',['فورد','نيسان','شفروليه'],1],['موستانج من شركة؟',['فورد','BMW','لكزس'],0],['لاندكروزر من؟',['تويوتا','ميتسوبيشي','كيا'],0],['سيارة سيفيك من؟',['هوندا','هيونداي','أودي'],0]],
riddle:[['شيء له أسنان ولا يعض؟',['المشط','الكرسي','القلم'],0],['كلما أخذت منه كبر، ما هو؟',['الحفرة','العمر','البحر'],0],['يمشي بلا قدمين ويبكي بلا عينين؟',['السحاب','الكتاب','النهر'],0],['ما الشيء الذي يسمع بلا أذن ويتكلم بلا لسان؟',['الصدى','الهاتف','الراديو'],0]]
};
function questionGame(key){let i=0,score=0;const arr=banks[key].sort(()=>Math.random()-.5);function draw(){if(i>=arr.length){$('gameArea').innerHTML=`<div class="center"><h2>انتهى التحدي! 🎉</h2><div class="big-number">${score}/${arr.length}</div><p>جمعت ${score*10} نقاط</p><button class="primary" onclick="openGame('${key}')">العب مرة ثانية</button></div>`;if(score)award(score*10);return}let q=arr[i];$('gameArea').innerHTML=`<div class="muted">السؤال ${i+1} من ${arr.length}</div><div class="question">${q[0]}</div><div class="answers">${q[1].map((a,j)=>`<button class="answer" onclick="pick(${j})">${a}</button>`).join('')}</div><div class="game-footer"><span class="muted">النقاط: ${score*10}</span></div>`}window.pick=j=>{let q=arr[i];let bs=[...document.querySelectorAll('.answer')];bs.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});if(j===q[2])score++;setTimeout(()=>{i++;draw()},650)};draw()}
function quiz(){questionGame('quiz')}function cars(){questionGame('cars')}function riddle(){questionGame('riddle')}
function reaction(){let phase=0,start=0;$('gameArea').innerHTML=`<p class="center">اضغط ابدأ، وانتظر حتى يتحول اللون للأخضر، ثم اضغط بسرعة.</p><div id="reactPad" class="reaction-pad">جاهز؟</div><div class="center"><button class="primary" id="reactStart">ابدأ التحدي</button></div><p id="reactResult" class="center muted"></p>`;$('reactStart').onclick=()=>{phase=1;$('reactPad').className='reaction-pad wait';$('reactPad').textContent='انتظر...';$('reactResult').textContent='';let delay=1200+Math.random()*2600;timer=setTimeout(()=>{phase=2;start=performance.now();$('reactPad').className='reaction-pad ready';$('reactPad').textContent='اضغط الآن!'},delay)};$('reactPad').onclick=()=>{if(phase===1){clearTimeout(timer);phase=0;$('reactResult').textContent='استعجلت! حاول مرة ثانية.'}else if(phase===2){let ms=Math.round(performance.now()-start);phase=0;$('reactResult').textContent=`زمنك ${ms} مللي ثانية`;if(ms<450)award(20)}}}
function memory(){let icons=['🍉','🚗','⭐','🐼','⚽','🍕','🎮','🌙'];let arr=[...icons,...icons].sort(()=>Math.random()-.5),first=null,lock=false,matched=0;$('gameArea').innerHTML=`<p class="center muted">افتح بطاقتين متشابهتين. طابق كل الرموز!</p><div class="memory-grid">${arr.map((_,i)=>`<button class="memory-cell" data-i="${i}">؟</button>`).join('')}</div><p id="memStatus" class="center">الأزواج: 0/8</p>`;document.querySelectorAll('.memory-cell').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('open')||b.dataset.done)return;let i=+b.dataset.i;b.textContent=arr[i];b.classList.add('open');if(first===null){first=b;return}lock=true;if(arr[+first.dataset.i]===arr[i]){first.dataset.done=b.dataset.done='1';matched++;$('memStatus').textContent=`الأزواج: ${matched}/8`;first=null;lock=false;if(matched===8){award(40);$('memStatus').textContent='فزت! +40 نقطة 🎉'}}else{let prev=first;first=null;setTimeout(()=>{prev.textContent=b.textContent='؟';prev.classList.remove('open');b.classList.remove('open');lock=false},700)}})}
function math(){let count=0,seconds=30,answer=0;function next(){let a=2+Math.floor(Math.random()*18),b=1+Math.floor(Math.random()*12),op=Math.random()>.5?'+':'−';answer=op==='+'?a+b:a-b;$('mathQ').textContent=`${a} ${op} ${b} = ؟`;$('mathInput').value=''}$('gameArea').innerHTML=`<div class="center"><div class="big-number" id="mathTime">30</div><div class="question" id="mathQ"></div><input id="mathInput" class="field" type="number" inputmode="numeric" placeholder="اكتب الإجابة"><button class="primary" id="mathSend">تأكيد</button><p id="mathScore">الإجابات الصحيحة: 0</p></div>`;next();$('mathSend').onclick=()=>{if(Number($('mathInput').value)===answer){count++;$('mathScore').textContent='الإجابات الصحيحة: '+count}next()};$('mathInput').onkeydown=e=>{if(e.key==='Enter')$('mathSend').click()};timer=setInterval(()=>{seconds--;$('mathTime').textContent=seconds;if(seconds<=0){clearInterval(timer);$('gameArea').innerHTML=`<div class="center"><h2>انتهى الوقت!</h2><div class="big-number">${count}</div><p>إجابة صحيحة</p><button class="primary" onclick="openGame('math')">إعادة</button></div>`;if(count)award(count*5)},1000)}
function xo(){let board=Array(9).fill(''),turn='X',over=false,mode='cpu';$('gameArea').innerHTML=`<div class="center"><button class="secondary" id="mode">الخصم: الكمبيوتر</button><p id="xoStatus">دور X</p><div class="xo">${board.map((_,i)=>`<button data-i="${i}"></button>`).join('')}</div><button class="primary" id="xoAgain">لعبة جديدة</button></div>`;const cells=[...document.querySelectorAll('.xo button')];function status(){let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return wins.find(line=>line.every(i=>board[i]&&board[i]===board[line[0]]))}function paint(){cells.forEach((c,i)=>{c.textContent=board[i];c.className=board[i]==='O'?'o':''});let w=status();if(w){over=true;$('xoStatus').textContent='الفائز '+board[w[0]]+' 🎉';award(15)}else if(board.every(Boolean)){over=true;$('xoStatus').textContent='تعادل!'}else $('xoStatus').textContent='دور '+turn}function cpu(){let choices=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(choices.length){let i=choices[Math.floor(Math.random()*choices.length)];board[i]='O';turn='X';paint()}}cells.forEach((c,i)=>c.onclick=()=>{if(over||board[i]||(mode==='cpu'&&turn==='O'))return;board[i]=turn;turn=turn==='X'?'O':'X';paint();if(!over&&mode==='cpu'&&turn==='O')setTimeout(cpu,350)});$('mode').onclick=()=>{mode=mode==='cpu'?'two':'cpu';$('mode').textContent=mode==='cpu'?'الخصم: الكمبيوتر':'الخصم: لاعب ثاني';reset()};function reset(){board=Array(9).fill('');turn='X';over=false;paint()}$('xoAgain').onclick=reset}
function pool(){let shots=0;$('gameArea').innerHTML=`<p class="center muted">اضغط على زر التسديد لتحريك الكرة. لعبة تصويب مصغرة.</p><div class="pool"><div class="ball" id="cue"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div></div><div class="center"><button class="primary" id="shoot">🎱 سدّد</button><p id="poolScore">التسديدات: 0</p></div>`;$('shoot').onclick=()=>{shots++;let hit=Math.random()>.35;$('poolScore').textContent=hit?`دخلت كرة! محاولة ${shots} 🎉`:`قريبة! حاول ثانية — محاولة ${shots}`;if(hit)award(5);$('cue').style.transform=`translate(${Math.random()*50-25}px,${Math.random()*35-18}px)`}}
function basket(){let shots=0,score=0;$('gameArea').innerHTML=`<p class="center muted">اضغط «صوّب» وحاول تسجل أكبر عدد.</p><div class="court"><div class="hoop">🏀 🏀</div></div><div class="center"><div class="big-number" id="basketScore">0</div><button class="primary" id="throw">🏀 صوّب</button><p id="basketMsg">التسديدات: 0</p></div>`;$('throw').onclick=()=>{shots++;let hit=Math.random()>.45;if(hit){score++;award(5)}$('basketScore').textContent=score;$('basketMsg').textContent=hit?'سلة! ممتاز 🔥':`ما دخلت، حاول مرة ثانية. (${shots})`}}
save();
</script>
</body></html>
