
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d1d">
<title>CHALLENGER ULTRA 2.0</title>
<style>
:root{
--bg:#080d1d;--panel:#121c34;--panel2:#1b2949;
--line:#30436b;--cyan:#43e8ff;--pink:#ff4da6;
--gold:#ffd166;--green:#56f2a4;--text:#f4f7ff;
--muted:#9caecc;
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;color:var(--text);
font-family:system-ui,-apple-system,sans-serif;
background:radial-gradient(ellipse at 50% -20%,#34528a 0,transparent 50%),linear-gradient(140deg,#080d1d,#10152d 60%,#21102e);
}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1050px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px;gap:10px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:49px;height:49px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),#7474ff,var(--pink));color:#07101d;font-size:26px;font-weight:1000;box-shadow:0 0 28px #43e8ff55}
h1{font-size:clamp(18px,4vw,26px);margin:0}
.brand small{color:var(--muted)}
.profile{background:#ffffff10;border:1px solid var(--line);padding:10px 12px;border-radius:13px;font-size:13px}
.hero{padding:23px;border-radius:25px;border:1px solid #6277a366;background:linear-gradient(120deg,#172f52,#321d48);position:relative;overflow:hidden}
.hero:after{content:"⚡";position:absolute;left:15px;top:-28px;font-size:120px;opacity:.08}
.hero h2{font-size:clamp(25px,5vw,38px);margin:0 0 7px}
.hero p{color:#c5d3ee;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.stat{background:#080e20a8;border:1px solid #ffffff20;padding:12px;border-radius:14px}
.stat b{display:block;font-size:22px;color:var(--cyan)}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#ffffff18;border-radius:20px;margin-top:15px;overflow:hidden}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#9b72ff);transition:.3s}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}
.section-title h3{margin:0}
.section-title span{font-size:12px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.game{min-height:135px;text-align:right;padding:15px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#1b2948,#11182b);position:relative;transition:.2s}
.game:active{transform:scale(.97)}
.emoji{font-size:30px}
.game h4{font-size:16px;margin:7px 0 3px}
.game p{font-size:12px;color:var(--muted);margin:0}
.go{position:absolute;left:14px;bottom:13px;color:var(--cyan);font-size:21px}
.primary{background:linear-gradient(100deg,#39dcff,#8180ff);color:#07101d;font-weight:900;padding:12px 19px;border-radius:13px;box-shadow:0 6px 22px #43e2ff24}
.secondary{background:#ffffff10;border:1px solid var(--line);padding:10px 14px;border-radius:12px}
.screen{display:none;margin-top:18px;background:#111a30;border:1px solid var(--line);border-radius:22px;padding:17px}
.screen.active{display:block}
.screen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:8px}
.screen-head h2{margin:0;font-size:20px}
.question{font-size:22px;font-weight:850;line-height:1.6;margin:18px 0}
.answers{display:grid;gap:9px}
.answer{background:#202e4e;border:1px solid #43577e;padding:14px;border-radius:13px;text-align:right}
.answer.correct{background:#174633;border-color:var(--green)}
.answer.wrong{background:#4b2039;border-color:var(--pink)}
.center{text-align:center}
.muted{color:var(--muted)}
.big-number{font-size:48px;font-weight:1000;color:var(--cyan);margin:15px}
.game-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.field{width:100%;padding:13px;background:#091224;color:white;border:1px solid var(--line);border-radius:12px;margin:9px 0}
.notice{background:#172743;border:1px solid var(--line);padding:12px;border-radius:12px;margin:12px 0}
.reaction-pad{height:190px;border-radius:19px;display:grid;place-items:center;font-size:23px;font-weight:900;margin:16px 0;background:#8b2d4d;user-select:none;touch-action:manipulation}
.reaction-pad.ready{background:#16764f}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:370px;margin:18px auto}
.memory-cell{aspect-ratio:1;background:#26395e;border:1px solid #4a6190;border-radius:13px;font-size:27px}
.memory-cell.open{background:#435b8b}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:18px auto}
.xo button{aspect-ratio:1;border-radius:15px;background:#202e4c;border:1px solid #42577f;font-size:43px;font-weight:900;color:var(--cyan)}
.xo button.o{color:var(--pink)}
.pool{background:radial-gradient(ellipse,#147b59,#064332);border:9px solid #80502e;border-radius:23px;padding:18px;min-height:190px;display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;margin:16px 0}
.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#f0d79b 25%,#bd8845 75%);box-shadow:2px 3px 5px #0019}
.ball.blue{background:radial-gradient(circle at 30% 25%,white,#f4f4f4 25%,#3979c9 75%)}
.court{height:200px;background:linear-gradient(90deg,#a95b2d,#d68a4b);border:5px solid #f1c18a;border-radius:18px;display:grid;place-items:center;margin:15px 0;overflow:hidden}
.basketball{font-size:45px;transition:.5s}
.hidden{display:none!important}
footer{text-align:center;color:#7787a8;font-size:11px;padding:25px}
@media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}.hero{padding:30px}}
</style>
</head>
<body>
<div class="wrap">

<header>
<div class="brand">
<div class="logo">C</div>
<div><h1>CHALLENGER ULTRA</h1><small>تحدّاك — العبها مع أصحابك</small></div>
</div>
<div class="profile">⭐ <b id="level">المستوى 1</b></div>
</header>

<section class="hero">
<h2>مين فيكم الأسطورة؟ 🔥</h2>
<p>تحديات وذكاء ومنافسة وجوائز. أثبت أنك الأفضل!</p>
<div class="stats">
<div class="stat"><b id="points">0</b><span>نقاطك</span></div>
<div class="stat"><b id="wins">0</b><span>انتصاراتك</span></div>
<div class="stat"><b id="rank">مبتدئ</b><span>لقبك</span></div>
</div>
<div class="progress"><div id="progress"></div></div>
<p id="nextLevel" style="font-size:11px;margin-top:8px">100 نقطة للمستوى التالي</p>
</section>

<div class="section-title">
<h3>🎮 اختر لعبتك</h3><span>9 ألعاب</span>
</div>

<div class="games">
<button class="game" onclick="openGame('quiz')"><div class="emoji">🧠</div><h4>أسئلة عامة</h4><p>اختبر معلوماتك</p><span class="go">←</span></button>
<button class="game" onclick="openGame('cars')"><div class="emoji">🏎️</div><h4>خبير السيارات</h4><p>اختبر معرفتك بالسيارات</p><span class="go">←</span></button>
<button class="game" onclick="openGame('riddle')"><div class="emoji">🧩</div><h4>ألغاز سريعة</h4><p>اكتشف الحل</p><span class="go">←</span></button>
<button class="game" onclick="openGame('reaction')"><div class="emoji">⚡</div><h4>سرعة ردة الفعل</h4><p>اختبر سرعتك</p><span class="go">←</span></button>
<button class="game" onclick="openGame('memory')"><div class="emoji">🎴</div><h4>اختبار الذاكرة</h4><p>طابق الرموز</p><span class="go">←</span></button>
<button class="game" onclick="openGame('math')"><div class="emoji">➗</div><h4>سباق الحساب</h4><p>30 ثانية من التحدي</p><span class="go">←</span></button>
<button class="game" onclick="openGame('xo')"><div class="emoji">⭕</div><h4>XO</h4><p>الكمبيوتر أو صديقك</p><span class="go">←</span></button>
<button class="game" onclick="openGame('pool')"><div class="emoji">🎱</div><h4>بلياردو مصغر</h4><p>صوّب وسجّل</p><span class="go">←</span></button>
<button class="game" onclick="openGame('basket')"><div class="emoji">🏀</div><h4>تحدي السلة</h4><p>سجّل أكبر عدد</p><span class="go">←</span></button>
</div>

<section id="screen" class="screen">
<div class="screen-head">
<h2 id="gameTitle">اللعبة</h2>
<button class="secondary" onclick="closeGame()">✕ رجوع</button>
</div>
<div id="gameArea"></div>
</section>

<footer>CHALLENGER ULTRA 2.0 © • تحدّاك</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const names={
quiz:'أسئلة عامة',cars:'خبير السيارات',riddle:'ألغاز سريعة',
reaction:'سرعة ردة الفعل',memory:'اختبار الذاكرة',
math:'سباق الحساب',xo:'XO',pool:'بلياردو مصغر',basket:'تحدي السلة'
};
let points=0,wins=0,current='',timer=null,gameToken=0;
try{
points=Number(localStorage.getItem('ch_points'))||0;
wins=Number(localStorage.getItem('ch_wins'))||0;
}catch(e){}

function save(){
try{
localStorage.setItem('ch_points',points);
localStorage.setItem('ch_wins',wins);
}catch(e){}
let level=Math.floor(points/100)+1;
$('points').textContent=points;
$('wins').textContent=wins;
$('level').textContent='المستوى '+level;
$('rank').textContent=points>=500?'أسطورة':points>=200?'محترف':points>=50?'متقدم':'مبتدئ';
$('progress').style.width=(points%100)+'%';
$('nextLevel').textContent=(100-points%100)+' نقطة للمستوى التالي';
}
function award(n){
points+=n;
wins++;
save();
}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function openGame(g){
clearTimeout(timer);clearInterval(timer);
gameToken++;
current=g;
$('screen').classList.add('active');
$('gameTitle').textContent=names[g];
$('screen').scrollIntoView({behavior:'smooth',block:'start'});
({
quiz,cars,riddle,reaction,memory,math,xo,pool,basket
})[g]();
}
function closeGame(){
clearTimeout(timer);clearInterval(timer);
gameToken++;
current='';
$('screen').classList.remove('active');
}

const banks={
quiz:[
['ما عاصمة اليابان؟',['طوكيو','أوساكا','كيوتو'],0],
['كم عدد أضلاع المثلث؟',['2','3','4'],1],
['ما أكبر كوكب؟',['الأرض','المشتري','المريخ'],1],
['كم دقيقة في الساعة؟',['30','60','100'],1],
['ما لون الزمرد؟',['أخضر','أزرق','أحمر'],0],
['ما أسرع حيوان بري؟',['الفهد','الأسد','الحصان'],0],
['كم عدد قارات العالم؟',['5','6','7'],2],
['ما الكوكب الأحمر؟',['الزهرة','المريخ','عطارد'],1],
['ما أكبر محيط؟',['الأطلسي','الهندي','الهادئ'],2],
['كم عدد أيام السنة العادية؟',['360','365','366'],1],
['ما الغاز الذي نتنفسه؟',['الأكسجين','الهيليوم','الهيدروجين'],0],
['كم ضلع للمربع؟',['3','4','5'],1]
],
cars:[
['أي شركة تصنع كامري؟',['تويوتا','نيسان','هوندا'],0],
['باترول من شركة؟',['فورد','نيسان','شفروليه'],1],
['موستانج من شركة؟',['فورد','BMW','لكزس'],0],
['لاندكروزر من؟',['تويوتا','ميتسوبيشي','كيا'],0],
['سيفيك من؟',['هوندا','هيونداي','أودي'],0],
['G-Class من؟',['مرسيدس','تويوتا','نيسان'],0],
['كورفيت من؟',['شفروليه','فورد','لكزس'],0],
['سوبرا من؟',['تويوتا','هوندا','كيا'],0],
['تشارجر من؟',['دودج','نيسان','BMW'],0],
['أكورد من؟',['هوندا','فورد','مازدا'],0],
['تاهو من؟',['شفروليه','تويوتا','أودي'],0],
['مازيراتي شركة إيطالية؟',['نعم','لا','يابانية'],0]
],
riddle:[
['شيء له أسنان ولا يعض؟',['المشط','الكرسي','القلم'],0],
['كلما أخذت منه كبر، ما هو؟',['الحفرة','العمر','البحر'],0],
['يمشي بلا قدمين ويبكي بلا عينين؟',['السحاب','الكتاب','النهر'],0],
['يسمع بلا أذن ويتكلم بلا لسان؟',['الصدى','الهاتف','الكتاب'],0],
['شيء تملكه ويستخدمه غيرك أكثر منك؟',['اسمك','سيارتك','قلمك'],0],
['ما الشيء الذي كلما زاد نقص؟',['العمر المتبقي','الماء','الطول'],0],
['له عين ولا يرى؟',['الإبرة','الإنسان','الطائر'],0],
['ما الذي يكتب ولا يقرأ؟',['القلم','الكتاب','الطالب'],0],
['بيت بلا أبواب ولا نوافذ؟',['البيضة','المدرسة','السيارة'],0],
['ما الشيء الذي يجري ولا يمشي؟',['الماء','الحجر','الكرسي'],0]
]
};

function questionGame(key){
let arr=shuffle(banks[key]),i=0,score=0,locked=false;
function draw(){
if(i>=arr.length){
let total=score*10;
$('gameArea').innerHTML=`<div class="center"><h2>انتهى التحدي! 🎉</h2><div class="big-number">${score}/${arr.length}</div><p>نتيجتك: ${total} نقطة</p><button class="primary" onclick="openGame('${key}')">العب مرة ثانية</button></div>`;
if(score)award(total);
return;
}
let q=arr[i];
$('gameArea').innerHTML=`
<div class="muted">السؤال ${i+1} من ${arr.length}</div>
<div class="question">${q[0]}</div>
<div class="answers">${q[1].map((a,j)=>`<button class="answer" data-j="${j}">${a}</button>`).join('')}</div>
<div class="game-footer"><span>النقاط: ${score*10}</span></div>`;
document.querySelectorAll('.answer').forEach(b=>{
b.onclick=()=>{
if(locked)return;
locked=true;
let j=Number(b.dataset.j);
document.querySelectorAll('.answer').forEach((x,k)=>{
x.disabled=true;
if(k===q[2])x.classList.add('correct');
if(k===j&&j!==q[2])x.classList.add('wrong');
});
if(j===q[2])score++;
setTimeout(()=>{i++;locked=false;draw()},650);
};
});
}
draw();
}
function quiz(){questionGame('quiz')}
function cars(){questionGame('cars')}
function riddle(){questionGame('riddle')}

function reaction(){
let phase=0,start=0;
$('gameArea').innerHTML=`
<p class="center">انتظر اللون الأخضر ثم اضغط بأسرع ما يمكن!</p>
<div id="reactPad" class="reaction-pad">جاهز؟</div>
<div class="center"><button class="primary" id="reactStart">ابدأ التحدي</button></div>
<p id="reactResult" class="center muted"></p>`;
$('reactStart').onclick=()=>{
clearTimeout(timer);
phase=1;
$('reactPad').className='reaction-pad';
$('reactPad').textContent='انتظر...';
$('reactResult').textContent='';
timer=setTimeout(()=>{
phase=2;
start=performance.now();
$('reactPad').classList.add('ready');
$('reactPad').textContent='اضغط الآن!';
},1200+Math.random()*3000);
};
$('reactPad').onclick=()=>{
if(phase===1){
clearTimeout(timer);phase=0;
$('reactResult').textContent='استعجلت! حاول مرة ثانية.';
$('reactPad').textContent='حاول مجدداً';
}else if(phase===2){
let ms=Math.round(performance.now()-start);
phase=0;
$('reactResult').textContent=`زمنك ${ms} مللي ثانية`;
if(ms<450)award(20);
}
};
}

function memory(){
let icons=['🍉','🚗','⭐','🐼','⚽','🍕','🎮','🌙'];
let arr=shuffle([...icons,...icons]),first=null,lock=false,matched=0;
$('gameArea').innerHTML=`
<p class="center muted">افتح بطاقتين متشابهتين وطابق الرموز الثمانية.</p>
<div class="memory-grid">${arr.map((_,i)=>`<button class="memory-cell" data-i="${i}">؟</button>`).join('')}</div>
<p id="memStatus" class="center">الأزواج: 0/8</p>`;
document.querySelectorAll('.memory-cell').forEach(b=>{
b.onclick=()=>{
if(lock||b.dataset.done||b.classList.contains('open'))return;
let i=Number(b.dataset.i);
b.textContent=arr[i];b.classList.add('open');
if(!first){first=b;return}
lock=true;
if(arr[Number(first.dataset.i)]===arr[i]){
first.dataset.done='1';b.dataset.done='1';
matched++;
$('memStatus').textContent=`الأزواج: ${matched}/8`;
first=null;lock=false;
if(matched===8){
award(40);
$('memStatus').textContent='فزت! +40 نقطة 🏆';
}
}else{
let prev=first;first=null;
setTimeout(()=>{
prev.textContent='؟';b.textContent='؟';
prev.classList.remove('open');b.classList.remove('open');
lock=false;
},750);
}
};
});
}

function math(){
let count=0,seconds=30,answer=0,ended=false;
$('gameArea').innerHTML=`
<div class="center">
<div class="big-number" id="mathTime">30</div>
<div class="question" id="mathQ"></div>
<input id="mathInput" class="field" type="number" inputmode="numeric" placeholder="اكتب الإجابة">
<button class="primary" id="mathSend">تأكيد الإجابة</button>
<p id="mathScore">الإجابات الصحيحة: 0</p>
</div>`;
function next(){
let a=2+Math.floor(Math.random()*18);
let b=1+Math.floor(Math.random()*12);
let op=random(['+','−','×']);
answer=op==='+'?a+b:op==='−'?a-b:a*b;
$('mathQ').textContent=`${a} ${op} ${b} = ؟`;
$('mathInput').value='';
}
function submit(){
if(ended||!$('mathInput').value)return;
if(Number($('mathInput').value)===answer){
count++;
$('mathScore').textContent='الإجابات الصحيحة: '+count;
}
next();
}
$('mathSend').onclick=submit;
$('mathInput').onkeydown=e=>{if(e.key==='Enter')submit()};
next();
timer=setInterval(()=>{
seconds--;
$('mathTime').textContent=seconds;
if(seconds<=0){
clearInterval(timer);ended=true;
$('gameArea').innerHTML=`<div class="center"><h2>انتهى الوقت! ⏱️</h2><div class="big-number">${count}</div><p>إجابة صحيحة</p><button class="primary" onclick="openGame('math')">إعادة اللعب</button></div>`;
if(count)award(count*5);
}
},1000);
}

function xo(){
let board=Array(9).fill(''),turn='X',over=false,mode='cpu',awarded=false;
$('gameArea').innerHTML=`
<div class="center">
<button class="secondary" id="mode">الخصم: الكمبيوتر</button>
<p id="xoStatus">دور X</p>
<div class="xo">${board.map((_,i)=>`<button data-i="${i}"></button>`).join('')}</div>
<button class="primary" id="xoAgain">لعبة جديدة</button>
</div>`;
let cells=[...document.querySelectorAll('.xo button')];
let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(){return lines.find(l=>board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]])}
function paint(){
cells.forEach((c,i)=>{c.textContent=board[i];c.className=board[i]==='O'?'o':''});
let w=winner();
if(w){
over=true;
$('xoStatus').textContent='الفائز '+board[w[0]]+' 🏆';
if(board[w[0]]==='X'&&!awarded){award(15);awarded=true}
}else if(board.every(Boolean)){
over=true;$('xoStatus').textContent='تعادل!';
}else $('xoStatus').textContent='دور '+turn;
}
function cpu(){
if(over)return;
let empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);
if(!empty.length)return;
let choice=empty.find(i=>{
let copy=[...board];copy[i]='O';
return lines.some(l=>l.every(x=>copy[x]==='O'));
});
if(choice===undefined)choice=empty.find(i=>{
let copy=[...board];copy[i]='X';
return lines.some(l=>l.every(x=>copy[x]==='X'));
});
if(choice===undefined&&board[4]==='')choice=4;
if(choice===undefined)choice=random(empty);
board[choice]='O';turn='X';paint();
}
function reset(){
board=Array(9).fill('');turn='X';over=false;awarded=false;paint();
}
cells.forEach((c,i)=>c.onclick=()=>{
if(over||board[i]||(mode==='cpu'&&turn==='O'))return;
board[i]=turn;
turn=turn==='X'?'O':'X';
paint();
if(!over&&mode==='cpu'&&turn==='O')timer=setTimeout(cpu,350);
});
$('mode').onclick=()=>{
mode=mode==='cpu'?'two':'cpu';
$('mode').textContent=mode==='cpu'?'الخصم: الكمبيوتر':'الخصم: لاعب ثاني';
reset();
};
$('xoAgain').onclick=reset;
paint();
}

function pool(){
let shots=0,score=0;
$('gameArea').innerHTML=`
<p class="center muted">اضغط على زر التسديد وحاول إصابة الكرات.</p>
<div class="pool" id="poolTable">
<div class="ball" id="cue"></div>
<div class="ball blue"></div><div class="ball"></div>
<div class="ball blue"></div><div class="ball"></div>
<div class="ball blue"></div>
</div>
<div class="center">
<div class="big-number" id="poolScore">0</div>
<button class="primary" id="shoot">🎱 سدّد</button>
<p id="poolMsg">المحاولات: 0</p>
</div>`;
$('shoot').onclick=()=>{
shots++;
let hit=Math.random()>.38;
if(hit){score++;award(5)}
$('poolScore').textContent=score;
$('poolMsg').textContent=hit?'دخلت كرة! ممتاز 🔥':`قريبة! المحاولة ${shots}`;
$('cue').style.transform=`translate(${Math.random()*90-45}px,${Math.random()*55-27}px)`;
};
}

function basket(){
let shots=0,score=0;
$('gameArea').innerHTML=`
<p class="center muted">صوّب وسجل أكبر عدد من السلات!</p>
<div class="court"><div class="basketball" id="basketBall">🏀</div></div>
<div class="center">
<div class="big-number" id="basketScore">0</div>
<button class="primary" id="throw">🏀 صوّب</button>
<p id="basketMsg">التسديدات: 0</p>
</div>`;
$('throw').onclick=()=>{
shots++;
let hit=Math.random()>.45;
let ball=$('basketBall');
ball.style.transform=hit?'translateY(-65px) scale(.7)':'translate(30px,-20px) rotate(90deg)';
if(hit){score++;award(5)}
$('basketScore').textContent=score;
$('basketMsg').textContent=hit?'سلة! أسطورة 🔥':`ما دخلت! محاولة ${shots}`;
setTimeout(()=>{if($('basketBall'))$('basketBall').style.transform='none'},550);
};
}
save();
</script>
